<!doctype html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>상품 목록</title>
</head>
<body>
    <button onclick="window.location.href='/task/product'">상품등록</button>
    <button onclick="window.location.href='/post/list'">글 목록</button>
    <table>
        <tr>
            <th>번호</th>
            <th>상품이름</th>
            <th>상품가격</th>
            <th>상품재고</th>
            <th>브랜드명</th>
        </tr>
        <th:block th:each="product : ${products}">
            <tr th:object="${product}">
                <td th:text="*{id}"></td>
                <td th:text="*{productName}"></td>
                <td th:text="*{productPrice}"></td>
                <td th:text="*{productStock}"></td>
                <td th:text="*{productBrand}"></td>
            </tr>
        </th:block>
    </table>
</body>
</html>
<script th:inline="javascript">
    const products = [[${products}]];
    console.log(products);
</script>
